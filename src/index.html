<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Type Fast</title>
<style>
    body{font: 17px system-ui;background:#172033;color:#fff;max-width:600px;margin:50px auto;padding: 16px}
    h1{color: #70e1d0}#quote{line-height:1.8;color:#cbd5e1}textarea{box-sizing: border-box;width:100%;height:110px;padding:12px;font:16px system-ui;border-radius:8px}button{padding:10px 18px;background: #70e1d0;border: 0;border-radius: 7px;cursor: pointer}

</style>
<h1>Type Fast</h1>
<p>Type the passage below as fast and accurately as you can.</p>
<p id="quote">Small steps every day can lead to big changes. Keep learning, stay curious, and never give up.</p>
<textarea id="input" placeholder="Start typing here..." spellcheck="false"></textarea>
<p>Time: <b id="time">30</b>s | WPM: <b id="acc">100</b>%</p>

<button id="reset">Restart</button>
<script>
    let q=document.querySelectora("#quote").textContent.trim(),t=30,start,done=false;
    const input=document.querySelector("#input");
    function tick() {
        let left=Math.max(0,30-(Date.now()-start)/1000);
        document.querySelector("#time").textContent=Math.ceil(left);
        let s=input.value,c=0;
        for(let i=0;i<s.length;i++)if(s[i]===q[i])c++;
        document.querySelector("#acc").textContent=s.length?Math.round(c/s.length*100):100;
        document.querySelector("#wpm").textContent=Math.round(c/5/Math.max((30-left)/60,1/60));
        if(!left){done=true;input.disabled=true}
    }
    input.oninput=()=>{
        if(done)return;
        if(!start)start=Date.now();
        tick();
    };
    setInterval(()=>{if(start&&!done)tick()},200);
    document.querySelector("#reset").onclick=()=>{
        start=0;done=false;input.disabled=false;input.value="";
        ["time","wpm","acc"].forEach((id,i)=>document.querySelector("#"+id).textContent=[30,0,100][i]);
    };
</script>
